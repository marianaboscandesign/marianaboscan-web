<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thanks for scrolling</title>
<style>
/* Cierre reutilizable para Behance. Se edita con parámetros en la URL:
   ?bg=14292C&fg=FBF8F4&ac=A0D0CE&f=Plus+Jakarta+Sans&b=Hanken+Grotesk  (colores en HEX sin #) */
:root{--bg:#14141e;--fg:#f4f1fb;--ac:#afb5e7;--fd:system-ui,sans-serif;--fb:system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb)}
a.cierre{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vw;height:100%;min-height:100%;text-align:center;
 padding:3vw 6vw;color:inherit;text-decoration:none;
 background:radial-gradient(60% 90% at 50% 0%,color-mix(in srgb,var(--ac) 22%,transparent),transparent)}
.logo{width:11vw;min-width:90px;aspect-ratio:407.55/175.94;background:var(--fg);
 -webkit-mask:url(../assets/mariana-boscan-logo-tinta.svg) center/contain no-repeat;
 mask:url(../assets/mariana-boscan-logo-tinta.svg) center/contain no-repeat}
h1{font-family:var(--fd);font-weight:700;font-size:5.2vw;line-height:1.05}
.sub{font-size:1.7vw;line-height:1.5;opacity:.85;max-width:74vw}
.ask{font-size:1.9vw;color:var(--ac)}
.web{display:inline-block;font-family:var(--fd);font-weight:600;font-size:2.6vw;padding:.9vw 2.4vw;border-radius:999px;border:.18vw solid var(--ac);transition:background .2s,color .2s}
a.cierre:hover .web,a.cierre:focus-visible .web{background:var(--ac);color:var(--bg)}
a.cierre:focus-visible{outline:3px solid var(--ac);outline-offset:-6px}
.note{font-size:.95vw;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
@media (max-width:700px){h1{font-size:9vw}.sub{font-size:3.4vw;max-width:85vw}.ask{font-size:3.6vw}.web{font-size:5vw;padding:2vw 5vw}.note{font-size:2.2vw}.logo{width:24vw}}
@media (prefers-reduced-motion:reduce){.web{transition:none}}
</style></head>
<body>
<a class="cierre" href="https://www.marianaboscan.com/en/" target="_blank" rel="noopener" aria-label="Visit marianaboscan.com">
 <span class="logo" role="img" aria-label="Mariana Boscán"></span>
 <h1>Thanks for scrolling!</h1>
 <p class="sub">Mariana Boscán · Graphic &amp; web designer.<br>I design brands, websites and design systems that look good and work well.</p>
 <p class="ask">Have a project in mind? Let’s talk.</p>
 <span class="web">marianaboscan.com</span>
 <p class="note" id="nota">Concept project. The brand, its people and its figures are fictional.</p>
</a>
<script>
(function(){
 var q=new URLSearchParams(location.search),r=document.documentElement.style;
 function hex(v){return /^[0-9a-f]{3,8}$/i.test(v||'')?'#'+v:null}
 var m={bg:'--bg',fg:'--fg',ac:'--ac'};
 for(var k in m){var h=hex(q.get(k));if(h)r.setProperty(m[k],h)}
 function font(n,v){if(!n||!/^[A-Za-z0-9+ ]{2,40}$/.test(n))return;
  var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+n.replace(/ /g,'+')+':wght@400;600;700&display=swap';document.head.appendChild(l);
  r.setProperty(v,'"'+n.replace(/\+/g,' ')+'",system-ui,sans-serif')}
 font(q.get('f'),'--fd');font(q.get('b'),'--fb');
 if(q.get('nota')==='0')document.getElementById('nota').style.display='none';
})();
</script>
</body></html>
