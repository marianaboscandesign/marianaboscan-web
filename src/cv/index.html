<style>

*{box-sizing:border-box;margin:0}

header{max-width:860px;margin:0 auto;padding:28px 16px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}

.btn.p{background:var(--ac);color:var(--onac)}
.btn:hover{filter:brightness(.96)}.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1{max-width:860px;margin:18px auto 0;padding:0 16px;font-size:clamp(26px,5vw,38px);line-height:1.1;letter-spacing:-.02em}

.hoja img{display:block;width:100%;height:auto}
footer{max-width:860px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:14px;text-align:center}
footer a{color:inherit}
