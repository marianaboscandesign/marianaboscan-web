<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marcador: imágenes de Behance</title>
<body style="font:16px/1.5 system-ui;max-width:640px;margin:40px auto;padding:0 16px">
<h1>Marcador «Copiar imágenes»</h1>
<p>1. Arrastra este botón a tu barra de favoritos:</p>
<p><a href="javascript:(async()=>{try{var%20m=location.pathname.match(/%5C/gallery%5C/(%5Cd+)%5C//);if(!m){alert('Abre%20primero%20la%20p%C3%A1gina%20de%20un%20proyecto%20de%20Behance');return}%0Afor(var%20y=0;y<=document.body.scrollHeight;y+=700){window.scrollTo(0,y);await%20new%20Promise(r=>setTimeout(r,250))}%0Avar%20seen={},out=[];document.querySelectorAll('img').forEach(function(i){var%20s=i.currentSrc||i.src||'';var%20k=s.match(/project_modules%5C/([%5E%5C/]+)%5C/([%5E%5C/?]+)$/);if(!k||!i.naturalWidth)return;if(i.naturalWidth<300)return;var%20u=s.replace(/project_modules%5C/[%5E%5C/]+%5C//,'project_modules/max_1200/');if(seen[u])return;seen[u]=1;out.push([u,Math.round(i.naturalHeight/i.naturalWidth*1000)/10])});%0Avar%20j=JSON.stringify({imgs:out},null,1);var%20ta=document.createElement('textarea');ta.value=j;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();%0Aalert('Listo:%20'+out.length+'%20im%C3%A1genes%20copiadas%20para%20el%20proyecto%20'+m[1]+'.%5CnCrea%20en%20GitHub%20el%20archivo%20data/imagenes/'+m[1]+'.json%20y%20pega.')}catch(e){alert('Error:%20'+e)}})();" style="display:inline-block;padding:12px 20px;background:#111;color:#fff;border-radius:999px;text-decoration:none">Copiar imágenes de Behance</a></p>
<p>2. Abre tu proyecto en Behance y pulsa el favorito (espera a que haga scroll).</p>
<p>3. En GitHub: <b>Add file → Create new file</b>, nombre <code>data/imagenes/ID.json</code> (el ID te lo dice el aviso), pega y <b>Commit</b>.</p></body></html>
