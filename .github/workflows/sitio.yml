name: Actualizar sitio

on:
  schedule:
    - cron: '17 */6 * * *'      # revisa Behance cada 6 horas
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]            # y cada vez que subes cambios

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer proyectos nuevos de Behance (y sus imágenes)
        run: python3 scripts/sync_behance.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Guardar los proyectos nuevos
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "behance-sync"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Nuevos proyectos de Behance"
            git push
          fi
      - name: Construir el sitio
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
